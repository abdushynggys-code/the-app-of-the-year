<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESET — device repair in Astana | Ремонт техники в Астане</title>
    <meta
      name="description"
      content="Сервисный центр RESET в Астане: ремонт смартфонов, планшетов, часов и ноутбуков. Бесплатная диагностика без записи, гарантия 1 год. ул. Конаева 35/1, ежедневно 10:00–20:00."
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Знак в закладке — тот же, что в шапке (src/components/Logo.tsx):
         экран с полосой света. Лежит прямо здесь, а не отдельным файлом:
         так браузер рисует его сразу, без второго запроса. Линии толще,
         чем в шапке, — на значке 16×16 тонкие просто исчезают. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2.6' y='4.2' width='18.8' height='15.6' rx='4' fill='none' stroke='%23000' stroke-width='2.2'/%3E%3Cpath d='M7 12h10' stroke='%230e7c86' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Как ссылка выглядит, когда её кидают в WhatsApp или Telegram.
         Роботы мессенджеров не выполняют JavaScript, поэтому теги стоят
         прямо здесь, а не добавляются приложением.
         Осталось добавить картинку 1200×630 и прописать og:image —
         тогда рядом с текстом появится ещё и превью. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RESET" />
    <meta property="og:locale" content="ru_RU" />
    <meta
      property="og:title"
      content="RESET — ремонт техники в Астане"
    />
    <meta
      property="og:description"
      content="Смартфоны, планшеты, часы и ноутбуки. Диагностика бесплатно и без записи, гарантия 1 год. Конаева 35/1, ежедневно 10:00–20:00."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифт не должен задерживать первую отрисовку. Обычный rel="stylesheet"
         блокирует её до ответа Google: на мобильном интернете это дороже,
         чем все анимации сайта вместе взятые. Хитрость с media="print":
         браузер скачивает файл, но не ждёт его, а после загрузки правило
         включается для экрана. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
